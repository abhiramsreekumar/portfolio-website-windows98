# This is a basic workflow to help you get started with Actions 
name: Portfolio Website CICD

# Controls when the action will run. Invokes the workflow on push events but only for the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - dev    
      
env:

  #Common
  AWS_REGION: "us-east-1" # Change to reflect your Region
  S3_BUCKET : ${{ secrets.S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION: ${{ secrets.CFDISTRIBUTIONID }}
  ROLE_TO_ASSUME : ${{ secrets.ROLE_TO_ASSUME }}



jobs:
  devBuild:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v3
      - name: Build React App
        run: npm install && npm run build

  mainBuild:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v3
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}
      - name: Build React App
        run: npm install && npm run build
      - name: Deploy app build to S3 bucket
        run: aws s3 sync ./dist/ s3://${{ env.S3_BUCKET }} --delete
      - uses: badsyntax/github-action-aws-cloudfront@master
        name: Invalidate CloudFront Cache
        id: invalidate-cloudfront-cache
        with:
          distribution-id: ${{ env.CLOUDFRONT_DISTRIBUTION }}
          aws-region: ${{ env.AWS_REGION }}
          include-origin-prefix: true
          invalidate-paths: "/*"
          default-root-object: "index.html"
